version: 2

models:
  - name: country_details_antarctica
    description: "Country details mart for Antarctica"
    data_tests:
      - unique:
          arguments:
            column_name: "(COUNTRY_COMMON_NAME || '|' || COUNTRY_CONTINENT_NAME || '|' || COALESCE(COUNTRY_CURRENCY, 'NO_CURRENCY'))"
    columns:
      - name: COUNTRY_COMMON_NAME
        data_tests:
          - not_null
      - name: COUNTRY_CONTINENT_NAME
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Antarctica']

